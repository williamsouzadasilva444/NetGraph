<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./image/logo-NetGraph.png" type="image/x-icon">
    <title>NetGraph</title>
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <img src="./image/logo-NetGraph.png" alt="NetGraph">
            <span class="logo-text">NetGraph</span>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="https://wa.me/5511998873427" target="_blank">Contato</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="app-container">
        <aside class="toolbar glass-panel">
            <div class="toolbar-group">
                <button id="btn-scan" class="toolbar-btn">Scanear Rede</button>
                <button id="btn-details" class="toolbar-btn">Detalhes da Rede</button>
                <button id="btn-export" class="toolbar-btn">Salvar e Exportar</button>
            </div>
        </aside>
            
        <section class="canvas-wrapper glass-panel">
            <div id="graph-container"></div>

            <div class="canvas" id="canvas"></div>

            <aside id="network-details-panel" class="details-panel hidden">



                <!-- Codigo novo, tirar se precisar -->
                <div class="details-header">
                    <h2>Detalhes da Rede</h2>

                    <button id="close-panel-btn">X</button>
                </div>

                <div class="details-content">    
                    <div class="detail-card">
                        <h3>Dispositivos Encontrados</h3>

                        <ul id="device-list">
                            <li>Nenhum dispositivo encontrado</li>
                        </ul>
                    </div>
                </div>

                <div class="detail-card">
                    <h3>Dispositivos Críticos</h3>

                    <p id="articulation-points">Nenhum dispositivo crítico</p>
                </div>

                <div class="detail-card">
                    <h3>Conexões Críticas</h3>

                    <p id="bridges">Nenhuma conexão crítica</p>
                </div>

                <div class="detail-card">
                    <h3>Dispositivo Central</h3>
                    <p id="centrality"> Nenhum dispositivo central</p>
                </div>
            
        </section>
        <script src="script.js"></script>
    </main>
</body>
</html>
