<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./image/logo-NetGraph.png" type="image/x-icon">
    <title>NetGraph</title>
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <img src="./image/logo-NetGraph.png" alt="NetGraph">
            <span class="logo-text">NetGraph</span>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="app-container">
        <aside class="toolbar glass-panel">
            <div class="toolbar-group">
                <button class="toolbar-btn">Botão 1</button>
                <button class="toolbar-btn">Botão 2</button>
                <button class="toolbar-btn">Botão 3</button>
            </div>
        </aside>
        
        <section class="canvas-wrapper glass-panel">
            <div class="canvas" id="canvas"></div>
        </section>
    </main>
</body>
</html>
